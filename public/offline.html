<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0a0a0a">
    <meta name="robots" content="noindex, nofollow">
    <title>Offline - LaraOwl</title>
    <style>
        :root {
            color-scheme: light dark;
            --bg: #ffffff;
            --fg: #0a0a0a;
            --muted: #6b6b6b;
            --line: #e5e5e5;
            --live: #d97706;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0a0a0a;
                --fg: #f5f5f5;
                --muted: #8f8f8f;
                --line: #262626;
                --live: #f59e0b;
            }
        }

        * { box-sizing: border-box; }

        html, body {
            height: 100%;
            margin: 0;
            background: var(--bg);
            color: var(--fg);
            font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        main {
            min-height: 100%;
            display: grid;
            place-items: center;
            padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
        }

        .panel {
            width: 100%;
            max-width: 360px;
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 28px 24px 24px;
        }

        .mark {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: -0.01em;
        }

        .mark img { width: 28px; height: 28px; border-radius: 6px; }

        .trace {
            margin: 28px 0 20px;
            height: 32px;
            width: 100%;
        }

        .trace path {
            fill: none;
            stroke: var(--muted);
            stroke-width: 1.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .trace .gap {
            stroke: var(--live);
            stroke-dasharray: 3 4;
        }

        h1 {
            margin: 0 0 6px;
            font-size: 17px;
            font-weight: 600;
            letter-spacing: -0.015em;
        }

        p {
            margin: 0;
            font-size: 13px;
            line-height: 1.55;
            color: var(--muted);
        }

        .row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 22px;
            padding-top: 16px;
            border-top: 1px solid var(--line);
            font-size: 12px;
            color: var(--muted);
            font-variant-numeric: tabular-nums;
        }

        button {
            appearance: none;
            border: 1px solid var(--fg);
            background: var(--fg);
            color: var(--bg);
            border-radius: 6px;
            padding: 7px 14px;
            font: inherit;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
        }

        button:active { transform: translateY(1px); }
    </style>
</head>
<body>
    <main>
        <div class="panel">
            <div class="mark">
                <img src="/icons/icon-192.png" alt="">
                LaraOwl
            </div>

            <svg class="trace" viewBox="0 0 312 32" preserveAspectRatio="none" aria-hidden="true">
                <path d="M0 22 L40 22 L52 8 L62 26 L72 16 L120 16 L132 20" />
                <path class="gap" d="M132 20 L216 20" />
                <path d="M216 20 L240 20 L250 10 L258 24 L268 18 L312 18" />
            </svg>

            <h1>You're offline</h1>
            <p>LaraOwl only shows live numbers, so nothing appears until the connection is back. This page reloads by itself when it is.</p>

            <div class="row">
                <span id="since">Lost at --:--</span>
                <button type="button" onclick="location.reload()">Try again</button>
            </div>
        </div>
    </main>
    <script>
        const now = new Date();
        document.getElementById('since').textContent =
            'Lost at ' + now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });
        window.addEventListener('online', () => location.reload());
    </script>
</body>
</html>
